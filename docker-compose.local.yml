services:
  selenium:
    image: selenium/standalone-firefox:latest
    container_name: selenium
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444"]
      interval: 1m
      timeout: 10s
      retries: 3
    networks:
      - main

  scrapper:  
    build:
      context: ./public_calls_scrapping/src
    container_name: api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/calls"]
      interval: 1m
      timeout: 10s
      retries: 3
    environment:
      - PYTHONPATH=/app
    depends_on:
      selenium:
        condition: service_healthy
    networks:
      - main

  frontend:
    build:
      context: ./inovamar-frontend
    container_name: frontend
    ports:
      - "127.0.0.1:8073:80"
    depends_on:
      scrapper:
        condition: service_healthy
    networks:
      - main
    environment:
      - API_HOST=scrapper
      - API_PORT=5000

networks:
  main:

volumes:
  scrapper_db:
